<!DOCTYPE html>
<html>
<head>

    <title>EduAI | Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f7fb;
        }

        .login-box {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(0,0,0,.08);
        }

        .login-logo {
            width: 55px;
            height: 55px;
            border-radius: 15px;
            background: linear-gradient(135deg,#526df5,#8b65ff);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .login-box h1 {
            margin-bottom: 8px;
        }

        .login-box p {
            color: #8992a5;
            font-size: 13px;
            margin-bottom: 28px;
        }

        .login-box label {
            display: block;
            font-size: 12px;
            margin-bottom: 7px;
            color: #555f73;
        }

        .login-box input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #e0e4ec;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
        }

        .login-box button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #526df5;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        .error {
            background: #fff0f0;
            color: #d9534f;
            padding: 10px;
            border-radius: 7px;
            margin-bottom: 15px;
            font-size: 12px;
        }

        .demo {
            text-align: center;
            margin-top: 18px;
            font-size: 11px;
            color: #9aa2b1;
        }

    </style>

</head>

<body>

<div class="login-box">

    <div class="login-logo">E</div>

    <h1>Welcome to EduAI</h1>

    <p>
        AI-powered student performance and
        academic analytics platform.
    </p>

    {% if error %}
    <div class="error">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST">

        <label>Student ID</label>

        <input
            type="text"
            name="student_id"
            placeholder="Enter your Student ID"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >

        <button type="submit">
            Sign In →
        </button>

    </form>

    <div class="demo">
        Demo password: 1234
    </div>

</div>

</body>
</html>
